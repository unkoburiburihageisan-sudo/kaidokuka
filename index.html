<!DOCTYPE html>
<html>
<head>
    <title>Deobfuscator Web</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        textarea { width: 100%; height: 200px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>String Deobfuscator</h1>
    <textarea id="input" placeholder="難読化されたコードをここにペースト"></textarea>
    <button onclick="deobfuscate()">解読実行</button>
    <h3>結果:</h3>
    <textarea id="output" readonly></textarea>

    <script>
        function deobfuscate() {
            let code = document.getElementById('input').value;
            // 16進数デコード
            code = code.replace(/\\x([0-9a-fA-F]{2})/g, (match, p1) => String.fromCharCode(parseInt(p1, 16)));
            // 10進数デコード
            code = code.replace(/\\([0-9]{1,3})/g, (match, p1) => String.fromCharCode(parseInt(p1, 10)));
            document.getElementById('output').value = code;
        }
    </script>
</body>
</html>
